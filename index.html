<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One State RP - حاسبة السيارات</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #ffa500; font-size: 22px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .car-card { background: #252525; padding: 12px; margin: 8px 0; border-radius: 6px; cursor: pointer; border: 1px solid #333; transition: 0.2s; }
        .car-card:hover { border-color: #ffa500; background: #2a2a2a; }
        .result-box { background: #111; padding: 15px; margin-top: 15px; border-radius: 6px; border: 1px solid #ffa500; }
        button { background: #ffa500; color: #000; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #ff8c00; }
        .parts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>حاسبة سيارات O_S RP</h1>
    
    <label>ابحث عن السيارة:</label>
    <input type="text" id="searchBox" placeholder="اكتب اسم السيارة..." oninput="filterCars()">

    <div id="carsList"></div>

    <div id="calcSection" style="display:none;" class="result-box">
        <h3 id="selectedCarTitle" style="color: #ffa500; margin-top:0;"></h3>
        
        <div class="parts-grid">
            <div><label>قطع حمراء (Red):</label><input type="number" id="p_red" value="0" min="0" oninput="calculate()"></div>
            <div><label>قطع ذهبية (Gold):</label><input type="number" id="p_gold" value="0" min="0" oninput="calculate()"></div>
            <div><label>قطع بنفسجية (Purple):</label><input type="number" id="p_purple" value="0" min="0" oninput="calculate()"></div>
            <div><label>قطع زرقاء (Blue):</label><input type="number" id="p_blue" value="0" min="0" oninput="calculate()"></div>
            <div><label>قطع خضراء (Green):</label><input type="number" id="p_green" value="0" min="0" oninput="calculate()"></div>
            <div><label>قطع رمادية (Gray):</label><input type="number" id="p_gray" value="0" min="0" oninput="calculate()"></div>
        </div>

        <div style="margin-top: 15px; font-size: 14px; line-height: 1.6;">
            <div>سعر الوكالة بالمطرقة: <span id="resHammerStock" style="color: #ffa500; font-weight: bold;">0</span></div>
            <div>الحد الأدنى بالتعديل: <span id="resMinMod" style="color: #00ff00; font-weight: bold;">0</span></div>
            <div>سعر المطرقة بالتعديل: <span id="resHammerMod" style="color: #00ff00; font-weight: bold;">0</span></div>
            <hr style="border-color: #444;">
            <div>إجمالي تقريبي (VM Min): <span id="resVmMin" style="color: #00ffff;">0</span></div>
            <div>إجمالي تقريبي (VM Max): <span id="resVmMax" style="color: #00ffff;">0</span></div>
        </div>
    </div>
</div>

<script>
    const carsDb = {
        "Aurus Senat": { p: 13000000, rt: "premium" },
        "BMW M5 F90": { p: 7000000, rt: "premium" },
        "Bugatti Chiron": { p: 35000000, rt: "premium" },
        "Chevrolet Camaro ZL1": { p: 4500000, rt: "medium" },
        "Dodge Charger SRT": { p: 4200000, rt: "medium" },
        "Ford Mustang GT": { p: 3800000, rt: "medium" },
        "Koenigsegg Jesko": { p: 45000000, rt: "premium" },
        "Lamborghini Aventador": { p: 22000000, rt: "premium" },
        "Mercedes-Benz G63": { p: 12000000, rt: "premium" },
        "Nissan GT-R R35": { p: 6500000, rt: "premium" },
        "Porsche 911 Turbo S": { p: 11000000, rt: "premium" },
        "Tesla Model S Plaid": { p: 5500000, rt: "medium" },
        "Toyota Supra MK4": { p: 5000000, rt: "medium" },
        "VAZ 2107": { p: 150000, rt: "economy" },
        "GAZ Volga": { p: 250000, rt: "economy" },
        "ZAZ 968": { p: 80000, rt: "economy" }
    };

    let activeCar = null;

    function renderCars(filter = "") {
        const listDiv = document.getElementById("carsList");
        listDiv.innerHTML = "";
        let count = 0;

        for (const [name, data] of Object.entries(carsDb)) {
            if (name.toLowerCase().includes(filter.toLowerCase())) {
                count++;
                const card = document.createElement("div");
                card.className = "car-card";
                card.innerHTML = `<strong>${name}</strong> <span style="float: left; color: #888;">السعر: ${data.p.toLocaleString()}</span>`;
                card.onclick = () => selectCar(name);
                listDiv.appendChild(card);
            }
        }
    }

    function filterCars() {
        const query = document.getElementById("searchBox").value;
        renderCars(query);
    }

    function selectCar(name) {
        activeCar = name;
        document.getElementById("selectedCarTitle").innerText = "السيارة المحددة: " + name;
        document.getElementById("calcSection").style.display = "block";
        // تصفير القطع عند اختيار سيارة جديدة
        ['red', 'gold', 'purple', 'blue', 'green', 'gray'].forEach(k => document.getElementById('p_' + k).value = 0);
        calculate();
    }

    function calculate() {
        if (!activeCar) return;
        const basePrice = carsDb[activeCar].p;

        const parts = {
            red: parseInt(document.getElementById("p_red").value) || 0,
            gold: parseInt(document.getElementById("p_gold").value) || 0,
            purple: parseInt(document.getElementById("p_purple").value) || 0,
            blue: parseInt(document.getElementById("p_blue").value) || 0,
            green: parseInt(document.getElementById("p_green").value) || 0,
            gray: parseInt(document.getElementById("p_gray").value) || 0
        };

        const weights = { red: 1.0, gold: 0.75, purple: 0.5, blue: 0.3, green: 0.15, gray: 0.05 };
        let totalWeightedParts = 0;
        for (const key in parts) {
            totalWeightedParts += parts[key] * weights[key];
        }

        const hammerStock = Math.ceil(basePrice * 1.2);
        const minMod = Math.ceil(basePrice * (1 + totalWeightedParts * 0.1));
        const hammerMod = Math.ceil(hammerStock * (1 + totalWeightedParts * 0.1));
        const vmMin = Math.ceil(minMod * 0.9);
        const vmMax = Math.ceil(hammerMod * 1.15);

        document.getElementById("resHammerStock").innerText = hammerStock.toLocaleString();
        document.getElementById("resMinMod").innerText = minMod.toLocaleString();
        document.getElementById("resHammerMod").innerText = hammerMod.toLocaleString();
        document.getElementById("resVmMin").innerText = vmMin.toLocaleString();
        document.getElementById("resVmMax").innerText = vmMax.toLocaleString();
    }

    // تشغيل القائمة عند فتح الصفحة
    renderCars();
</script>

</body>
</html>
