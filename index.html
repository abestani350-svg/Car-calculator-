<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">O_S RP - حاسبة السيارات حسب الشركات</title>
<style>
:root { --bg: #121212; --card-bg: #1e1e1e; --input-bg: #252525; --border: #444; --accent: #ff9800; --text: #fff; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
.container { max-width: 750px; margin: 0 auto; background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
h2, h3 { text-align: center; color: var(--accent); margin: 5px 0 15px; }
.flex { display: flex; gap: 10px; flex-wrap: wrap; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.lang-btn { background: var(--input-bg); color: var(--accent); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
.search-container { display: flex; justify-content: center; width: 100%; margin-bottom: 12px; }
.search-box { width: 100%; padding: 11px; background: var(--input-bg); border: 1px solid var(--border); color: #fff; border-radius: 8px; outline: none; font-size: 15px; box-sizing: border-box; }
.type-filters { display: flex; gap: 8px; margin-bottom: 12px; width: 100%; }
.type-btn { flex: 1; padding: 10px; background: var(--input-bg); border: 1px solid var(--border); color: #aaa; border-radius: 8px; cursor: pointer; font-weight: bold; text-align: center; }
.type-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
.brands-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; max-height: 450px; overflow-y: auto; }
.brand-card { background: var(--input-bg); border: 1px solid var(--border); padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; font-weight: bold; color: var(--accent); text-transform: uppercase; }
.cars-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; max-height: 450px; overflow-y: auto; }
.car-card { background: var(--input-bg); padding: 12px; border-radius: 8px; cursor: pointer; border: 1px solid #333; display: flex; flex-direction: column; justify-content: space-between; }
.badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
.badge.secret { background: #e74c3c; color: #fff; } .badge.legendary { background: #ffcc00; color: #000; } .badge.epic { background: #af52de; color: #fff; } .badge.rare { background: #007aff; color: #fff; } .badge.uncommon { background: #34c759; color: #000; }
.btn-back { background: #e74c3c; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
#carListView, #tuningView { display: none; }
.car-info-box { background: var(--input-bg); padding: 12px; border-radius: 8px; margin: 12px 0; font-size: 14px; border-right: 4px solid var(--accent); }
.info-row { margin: 5px 0; display: flex; justify-content: space-between; align-items: center; }
.parts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.part-item { background: var(--input-bg); padding: 8px 10px; border-radius: 6px; border-bottom: 3px solid #333; display: flex; flex-direction: column; }
.part-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; }
.counter-box { display: flex; align-items: center; justify-content: space-between; background: #1a1a1a; border: 1px solid var(--border); border-radius: 6px; margin-top: 6px; overflow: hidden; height: 38px; }
.counter-btn { background: #333; color: #fff; border: none; width: 40px; height: 100%; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.counter-value { font-weight: bold; font-size: 16px; color: #fff; flex: 1; text-align: center; }
.p-red { border-bottom-color: #ff3b30; } .p-gold { border-bottom-color: #ffcc00; } .p-purple { border-bottom-color: #af52de; } .p-blue { border-bottom-color: #007aff; } .p-green { border-bottom-color: #34c759; } .p-gray { border-bottom-color: #8e8e93; }
.result { background: var(--input-bg); padding: 15px; margin-top: 15px; border-radius: 8px; border-right: 5px solid var(--accent); }
.res-row { margin: 8px 0; font-size: 15px; display: flex; justify-content: space-between; }
.val { font-weight: bold; }
</style>
</head>
<body>
<div class="container">
<div class="top-bar"><button class="lang-btn" onclick="toggleLanguage()">🌐 English / العربية</button></div>
<h2 id="mainTitle">O_S RP - حاسبة السيارات حسب الشركات</h2>
<div id="brandsView">
<div class="search-container"><input type="text" id="globalSearch" class="search-box" placeholder="🔍 ابحث عن أي سيارة مباشرة بالاسم..." onkeyup="globalSearchCars(this.value)"></div>
<div class="type-filters">
<button class="type-btn" id="btnEconomy" onclick="setTypeFilter('economy', this)">اقتصادي</button>
<button class="type-btn" id="btnPremium" onclick="setTypeFilter('premium', this)">فاخر</button>
<button class="type-btn active" id="btnAll" onclick="setTypeFilter('all', this)">الكل</button>
</div>
<div class="flex" style="justify-content: space-between; align-items: center; font-size: 13px; color: #888; margin-bottom: 8px;">
<span id="selectBrandLabel">اختر الشركة لعرض سياراتها:</span>
<span id="totalCarsCount" style="color: var(--accent); font-weight: bold;">مجموع السيارات: 0</span>
</div>
<div class="brands-grid" id="brandsGrid"></div>
</div>
<div id="carListView">
<div class="flex" style="justify-content: space-between; align-items: center; margin-bottom: 12px;">
<button class="btn-back" id="backToBrandsBtn" onclick="showBrandsView()">العودة للشركات</button>
<h3 id="selectedBrandTitle" style="margin:0; text-transform: uppercase;"></h3>
</div>
<div style="font-size: 13px; color: #888; margin-bottom: 8px;" id="carCountInfo">عدد السيارات: 0</div>
<div class="cars-grid" id="carsGrid"></div>
</div>
<div id="tuningView">
<div class="flex" style="justify-content: space-between; align-items: center; margin-bottom: 15px;">
<button class="btn-back" id="backToCarsBtn" onclick="showCarListAgain()">العودة للسيارات</button>
<h3 id="selectedCarTitle" style="margin:0; text-transform: uppercase;"></h3>
</div>
<div class="car-info-box">
<div class="info-row"><span id="lblMinStock">السعر الأدنى الستوك المعتمد:</span> <span id="infoPrice" style="color: #2196F3; font-weight: bold;">0$</span></div>
<div class="info-row"><span id="lblRarity">ندرة السيارة والفئة:</span> <span id="infoRarity" style="font-weight: bold;">-</span></div>
</div>
<label id="lblEnterParts" style="display:block; text-align:inherit; font-weight: bold; color: var(--accent);">اختر عدد قطع التعديل (من 0 إلى 8):</label>
<div class="parts-grid" id="partsGridInputs"></div>
<div class="result">
<div class="res-row"><span id="lblHammerStock">🔨 سعر المطرقة ستوك :</span> <span id="outStock" class="val">0</span></div>
<div class="res-row"><span id="lblMinMod">🔵 السعر الأدنى الحالي :</span> <span id="outMin" class="val" style="color:#2196F3;">0</span></div>
<div class="res-row"><span id="lblHammerMod">🟠 سعر المطرقة الحالي :</span> <span id="outHammer" class="val" style="color:var(--accent);">0</span></div>
<hr style="border: 0; border-top: 1px solid var(--border); margin: 10px 0;">
<div class="res-row"><span id="lblVmMin">حد السوق الأدنى المتوقع : </span> <span id="outVmMin" class="val" style="color:#e91e63;">0</span></div>
<div class="res-row"><span id="lblVmMax">📈 الحد الأعلى المتوقع : </span> <span id="outVmMax" class="val" style="color:#4caf50;">0</span></div>
</div>
</div>
</div>
<script>
const BACKEND_URL = '/api/calculate';
let lang = 'ar';
let partsData = { red: 0, gold: 0, purple: 0, blue: 0, green: 0, gray: 0 };
let carsCache = [];
const translations = {
ar: { title: "O_S RP - حاسبة السيارات حسب الشركات", searchPlaceholder: "🔍 ابحث عن أي سيارة مباشرة بالاسم...", economy: "اقتصادي", premium: "فاخر", all: "الكل", selectBrand: "اختر الشركة لعرض سياراتها:", totalCars: "مجموع السيارات: ", carCount: "عدد السيارات: ", carsSuffix: "سيارات", backToBrands: "العودة للشركات", backToCars: "العودة للسيارات", minStock: "السعر الأدنى الستوك المعتمد:", rarityLbl: "ندرة السيارة والفئة:", enterParts: "اختر عدد قطع التعديل (من 0 إلى 8):", hammerStock: "🔨 سعر المطرقة ستوك :", minMod: "🔵 السعر الأدنى المطور:", hammerMod: "🟠 سعر المطرقة المطور النهائي:", vmMin: " حد السوق الأدنى المتوقع :", vmMax: "📈 الحد الأعلى المتوقع :", noMatch: "لم يتم العثور على سيارة مطابقة ضمن الفلتر المختار", tiers: { premium: "فاخر", medium: "متوسط", economy: "اقتصادي" }, parts: { red: { name: 'أحمر', code: 'RED' }, gold: { name: 'ذهبي', code: 'GOLD' }, purple: { name: 'بنفسجي', code: 'PURPLE' }, blue: { name: 'أزرق', code: 'BLUE' }, green: { name: 'أخضر', code: 'GREEN' }, gray: { name: 'فضي', code: 'GRAY' } } },
en: { title: "O_S RP - Cars Calculator by Brands", searchPlaceholder: "🔍 Search any car by name...", economy: "Economy", premium: "Premium", all: "All", selectBrand: "Select a brand to view its cars:", totalCars: "Total Cars: ", carCount: "Cars Count: ", carsSuffix: "cars", backToBrands: "Back to Brands", backToCars: "Back to Cars", minStock: "Approved Min Stock Price:", rarityLbl: "Car Rarity & Tier:", enterParts: "Select tuning parts count (0 to 8):", hammerStock: "🔨 Stock Hammer Price:", minMod: "🔵 Min Upgraded Price:", hammerMod: "Final Upgraded Hammer Price:", vmMin: "⚖ Expected Market Min (VM Min):", vmMax: "📈 Expected Market Max (VM Max):", noMatch: "No matching car found under the selected filter", tiers: { premium: "PREMIUM", medium: "MEDIUM", economy: "ECONOMY" }, parts: { red: { name: 'Red', code: 'RED' }, gold: { name: 'Gold', code: 'GOLD' }, purple: { name: 'Purple', code: 'PURPLE' }, blue: { name: 'Blue', code: 'BLUE' }, green: { name: 'Green', code: 'GREEN' }, gray: { name: 'Gray', code: 'GRAY' } } }
};
let currentCar = null, currentType = 'all', activeBrand = '';
const partsMeta = [{id: 'red', key: 'red', cls: 'p-red', color: '#ff3b30'}, {id: 'gold', key: 'gold', cls: 'p-gold', color: '#ffcc00'}, {id: 'purple', key: 'purple', cls: 'p-purple', color: '#af52de'}, {id: 'blue', key: 'blue', cls: 'p-blue', color: '#007aff'}, {id: 'green', key: 'green', cls: 'p-green', color: '#34c759'}, {id: 'gray', key: 'gray', cls: 'p-gray', color: '#8e8e93'}];
async function init() {
try { const res = await fetch('/api/cars'); carsCache = await res.json(); } catch(e) { carsCache = []; }
renderPartsInputs(); renderBrands();
}
function toggleLanguage() {
lang = lang === 'ar' ? 'en' : 'ar';
const htmlRoot = document.getElementById('htmlRoot');
htmlRoot.setAttribute('lang', lang); htmlRoot.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
updateTexts();
if(activeBrand) renderCarsGrid(activeBrand); else renderBrands();
if(currentCar) selectCar(currentCar);
}
function updateTexts() {
const t = translations[lang];
document.getElementById('pageTitle').innerText = t.title;
document.getElementById('mainTitle').innerText = t.title;
document.getElementById('globalSearch').placeholder = t.searchPlaceholder;
document.getElementById('btnEconomy').innerText = t.economy;
document.getElementById('btnPremium').innerText = t.premium;
document.getElementById('btnAll').innerText = t.all;
document.getElementById('selectBrandLabel').innerText = t.selectBrand;
document.getElementById('backToBrandsBtn').innerText = t.backToBrands;
document.getElementById('backToCarsBtn').innerText = t.backToCars;
document.getElementById('lblMinStock').innerText = t.minStock;
document.getElementById('lblRarity').innerText = t.rarityLbl;
document.getElementById('lblEnterParts').innerText = t.enterParts;
document.getElementById('lblHammerStock').innerText = t.hammerStock;
document.getElementById('lblMinMod').innerText = t.minMod;
document.getElementById('lblHammerMod').innerText = t.hammerMod;
document.getElementById('lblVmMin').innerText = t.vmMin;
document.getElementById('lblVmMax').innerText = t.vmMax;
renderPartsInputs();
if(!activeBrand) renderBrands();
}
function renderPartsInputs() {
const pDict = translations[lang].parts;
document.getElementById('partsGridInputs').innerHTML = partsMeta.map(p => `
<div class="part-item ${p.cls}">
<div class="part-header"><span style="color:${p.color}">${pDict[p.key].name}</span><span style="color:${p.color}; font-size:11px;">(${pDict[p.key].code})</span></div>
<div class="counter-box">
<button class="counter-btn" onclick="changePart('${p.id}', -1)">-</button>
<span class="counter-value" id="val_${p.id}">${partsData[p.id]}</span>
<button class="counter-btn" onclick="changePart('${p.id}', 1)">+</button>
</div></div>`).join('');
}
function changePart(id, delta) {
partsData[id] = Math.max(0, Math.min(8, partsData[id] + delta));
document.getElementById(`val_${id}`).innerText = partsData[id];
calculate();
}
function setTypeFilter(type, btn) {
currentType = type;
document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
btn.classList.add('active');
const q = document.getElementById('globalSearch').value;
if(q.trim()) globalSearchCars(q); else renderBrands();
}
function renderBrands() {
const brandsGrid = document.getElementById('brandsGrid');
const filteredCars = carsCache.filter(c => currentType === 'all' || c.t === currentType);
const brands = [...new Set(filteredCars.map(c => c.b))].sort();
document.getElementById('totalCarsCount').innerText = translations[lang].totalCars + filteredCars.length;
const suffix = translations[lang].carsSuffix;
brandsGrid.innerHTML = brands.map(b => {
const count = filteredCars.filter(c => c.b === b).length;
return `<div class="brand-card" onclick="selectBrand('${b}')"><div>${b}</div><div style="font-size:11px; color:#aaa; margin-top:4px;">(${count} ${suffix})</div></div>`;
}).join('');
}
function selectBrand(brand) {
activeBrand = brand;
document.getElementById('brandsView').style.display = 'none';
document.getElementById('carListView').style.display = 'block';
document.getElementById('selectedBrandTitle').innerText = brand;
renderCarsGrid(brand);
}
function renderCarsGrid(brand) {
const carsGrid = document.getElementById('carsGrid');
const filtered = carsCache.filter(c => c.b === brand && (currentType === 'all' || c.t === currentType));
document.getElementById('carCountInfo').innerText = translations[lang].carCount + filtered.length;
carsGrid.innerHTML = filtered.map(c => `
<div class="car-card" onclick='selectCar(${JSON.stringify(c)})'>
<div><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;"><strong style="font-size:13px; color:#fff;">${c.n}</strong><span class="badge ${c.c}">${c.cn[lang]}</span></div></div>
<div style="font-size:12px; color:#aaa; border-top:1px solid #333; padding-top:5px; margin-top:5px;">Min: <span style="color:#2196F3;">${(c.p || 0).toLocaleString()}</span><br>Hammer: <span style="color:var(--accent);">${Math.ceil((c.p || 0)*1.2).toLocaleString()}</span></div>
</div>`).join('');
}
function showBrandsView() { document.getElementById('carListView').style.display = 'none'; document.getElementById('brandsView').style.display = 'block'; activeBrand = ''; }
function showCarListAgain() { document.getElementById('tuningView').style.display = 'none'; document.getElementById('carListView').style.display = 'block'; currentCar = null; }
function globalSearchCars(query) {
const brandsGrid = document.getElementById('brandsGrid');
if(!query.trim()) { renderBrands(); return; }
const matches = carsCache.filter(c => (currentType === 'all' || c.t === currentType) && (c.n.toLowerCase().includes(query.toLowerCase()) || c.b.toLowerCase().includes(query.toLowerCase())));
const alignStyle = lang === 'ar' ? 'text-align:right;' : 'text-align:left;';
brandsGrid.innerHTML = matches.length ? matches.map(c => `<div class="car-card" onclick='selectCar(${JSON.stringify(c)})' style="${alignStyle} padding:10px;"><div style="font-size:13px; color:#fff;">${c.n}</div><div style="font-size:11px; color:var(--accent);">${c.b}</div></div>`).join('') : `<div style="grid-column: 1/-1; text-align:center; color:#888; padding:10px;">${translations[lang].noMatch}</div>`;
}
function selectCar(car) {
currentCar = car;
document.getElementById('brandsView').style.display = 'none';
document.getElementById('carListView').style.display = 'none';
document.getElementById('tuningView').style.display = 'block';
document.getElementById('selectedCarTitle').innerText = car.n;
document.getElementById('infoPrice').innerText = (car.p || 0).toLocaleString() + "$";
let rarityColor = '#fff';
if(car.c === 'uncommon') rarityColor = '#34c759'; else if(car.c === 'rare') rarityColor = '#007aff'; else if(car.c === 'epic') rarityColor = '#af52de'; else if(car.c === 'legendary') rarityColor = '#ffcc00'; else if(car.c === 'secret') rarityColor = '#e74c3c';
document.getElementById('infoRarity').innerHTML = `<span style="color:#ffffff;">${translations[lang].tiers[car.rt]}</span> <span style="color:#2e7d32; font-weight:bold;">|</span> <span style="color:${rarityColor};">${car.cn[lang]}</span>`;
Object.keys(partsData).forEach(k => partsData[k] = 0);
renderPartsInputs(); calculate();
}
async function calculate() {
if(!currentCar) return;
try {
const response = await fetch(BACKEND_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ carName: currentCar.n, parts: partsData }) });
const result = await response.json();
document.getElementById('outStock').innerText = result.hammerStock.toLocaleString() + "$";
document.getElementById('outMin').innerText = result.minMod.toLocaleString() + "$";
document.getElementById('outHammer').innerText = result.hammerMod.toLocaleString() + "$";
document.getElementById('outVmMin').innerText = result.vmMin.toLocaleString() + "$";
document.getElementById('outVmMax').innerText = result.vmMax.toLocaleString() + "$";
} catch(e) {}
}
init();
</script>
</body>
</html>
